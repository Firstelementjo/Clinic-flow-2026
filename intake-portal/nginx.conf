server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Patient Intake Portal SPA fallback (/c/{clinicKey})
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (keep config.json uncached so apiBaseUrl updates apply immediately)
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # One-Way Quarantine API Proxy: ONLY public intake endpoints are exposed
    location /api/v1/public/intake/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Block all other /api/ paths on the public intake origin (one-way security isolation)
    location /api/ {
        return 404;
    }

    # Health Check Endpoint
    location /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
