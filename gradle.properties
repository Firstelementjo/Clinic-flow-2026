# -Djava.net.preferIPv4Stack is required on hosts whose IPv6 socket handling is broken.
# Without it the Gradle daemon reports "Could not connect to the Gradle daemon" and, once the
# daemon is reachable, every Testcontainers integration test fails with
# "BindException: Cannot assign requested address: getsockopt" when JDBC reaches its container.
# It is set here rather than in GRADLE_OPTS because forked test workers inherit these JVM args,
# and they are the JVMs that talk to Docker. See ops/quality/RUNBOOK-local-build-failures.md.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
org.gradle.parallel=true