# =====================================================================
# FirstElement required quality gates
#
# One job per stage of ops/quality/gate-stages.json, in the order
# plan.md 7.1 requires, each calling the SAME runner a developer calls.
# Nothing here reimplements a gate: a command that appears in this file
# and not in the catalogue is a divergence, and check-scripts.ps1 fails
# the run if this file stops calling the runner at all.
#
# WHY ONE JOB PER STAGE RATHER THAN ONE JOB WITH STEPS
#   A red stage must be VISIBLE. With steps, GitHub reports the first
#   failure, cancels the rest of the job, and a green integration stage
#   and a red security stage collapse into one red blob nobody can
#   unpick. Each stage here is its own required status check with its own
#   log and its own evidence directory.
#
# ORDERING
#   Expressed with `needs:`. A stage that the next one does not need runs
#   in parallel; the sequence is the dependency chain, so a failure stops
#   the chain instead of burning minutes on later stages that cannot pass.
#
# DOCKER IS A HARD REQUIREMENT
#   The container and data gates call `docker version` before anything
#   else and fail when the engine is absent. Testcontainers without Docker
#   produces JUnit files full of skipped tests, and the failure would then
#   be reported as a skip -- i.e. as a test problem -- instead of as the
#   real cause, a missing service.
#
# EVIDENCE IS ALWAYS UPLOADED
#   `if: always()` on every upload. The run you need the evidence from is
#   the one that failed.
# =====================================================================
name: firstelement-quality-gates

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ 'main', 'master', 'migration/**' ]
  workflow_dispatch: {}

# A pull request, especially from a fork, must not be able to write to the
# repository or reach secrets through this pipeline.
permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every Gradle stage already passes --rerun-tasks --no-build-cache; this
  # disables the daemon and the read-only cache as a second line of
  # defence, because a restored cache entry is indistinguishable from a
  # test that ran.
  GRADLE_OPTS: '-Dorg.gradle.caching=false -Dorg.gradle.daemon=false'

jobs:
  format-static:
    name: 'gate 01 format + static'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages format-static -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/format-static.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-format-static
          path: build/quality-evidence/**

  legacy-node-static:
    name: 'gate 02 legacy node static'
    needs: format-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages legacy-node-static -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/legacy-node-static.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-legacy-node-static
          path: build/quality-evidence/**

  backend-compile:
    name: 'gate 03 backend compile'
    needs: legacy-node-static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages backend-compile -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/backend-compile.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend-compile
          path: build/quality-evidence/**

  backend-unit:
    name: 'gate 04 backend unit tests'
    needs: backend-compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages backend-unit -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/backend-unit.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend-unit
          path: build/quality-evidence/**

  architecture:
    name: 'gate 05 architecture'
    needs: backend-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages architecture -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/architecture.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-architecture
          path: build/quality-evidence/**

  backend-integration:
    name: 'gate 06 testcontainers integration'
    needs: [ backend-unit, architecture ]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Docker engine must be present
        run: |
          set -euo pipefail
          docker version
          docker info
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages backend-integration -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/backend-integration.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backend-integration
          path: build/quality-evidence/**

  openapi-contract:
    name: 'gate 07 openapi + contract'
    needs: backend-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages openapi-contract -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/openapi-contract.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-openapi-contract
          path: build/quality-evidence/**

  security-tenant-negative:
    name: 'gate 08 security + tenant negatives'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The negatives are asserted over the reports the integration stage
      # actually produced, not over a re-run that might behave
      # differently.
      - uses: actions/download-artifact@v4
        with:
          name: evidence-backend-integration
          path: build/quality-evidence
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages security-tenant-negative -EvidenceRoot "${{ github.workspace }}/build/quality-evidence/security" -JsonOut "${{ github.workspace }}/build/quality-evidence/security.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-security-tenant-negative
          path: build/quality-evidence/**

  worker-idempotency-recovery:
    name: 'gate 09 worker + idempotency + recovery'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: evidence-backend-integration
          path: build/quality-evidence
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages worker-idempotency-recovery -EvidenceRoot "${{ github.workspace }}/build/quality-evidence/worker" -JsonOut "${{ github.workspace }}/build/quality-evidence/worker.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-worker-idempotency-recovery
          path: build/quality-evidence/**

  export-finance:
    name: 'gate 10 export + finance reconciliation'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      # This job was RED on purpose until backend/reporting-finance and
      # backend/reporting-exports existed. BOTH NOW EXIST, and in Phase 41 the
      # stage was found to have been written against a module named
      # `backend/exports`, which was renamed before the stage ever ran -- so the
      # requiresPaths refusal was masking a command that also named a task that
      # no longer exists. Both are corrected, and the stage now actually runs.
      #
      # Had the requiresPaths been satisfied by renaming alone, the stage would
      # still have failed on `:backend:exports:test`; a gate that has never
      # executed once is not a gate, and nothing in the pipeline said so.
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages export-finance -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/export-finance.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-export-finance
          path: build/quality-evidence/**

  angular-component:
    name: 'gate 11 angular component tests'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      # RED until frontend/ exists (Phase 11). See the header.
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages angular-component -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/angular-component.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-angular-component
          path: build/quality-evidence/**

  playwright-journeys:
    name: 'gate 12 playwright journeys'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install browsers
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      # RED until an Angular workspace and a Playwright install exist
      # (Phase 11). See the header.
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages playwright-journeys -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/playwright-journeys.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-playwright-journeys
          path: build/quality-evidence/**

  performance-smoke:
    name: 'gate 13 performance smoke'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Docker engine must be present
        run: |
          set -euo pipefail
          docker version
      - name: PostgreSQL/pgvector for the telemetry database
        run: |
          set -euo pipefail
          docker run -d --name firstelement-postgres \
            -e POSTGRES_USER=firstelement -e POSTGRES_PASSWORD=firstelement \
            -e POSTGRES_DB=firstelement -p 5432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec firstelement-postgres pg_isready -U firstelement >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec firstelement-postgres pg_isready -U firstelement
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      # Requires a booted application. Without one the harness FAILS with
      # the command to start it; it never reports a pass it did not
      # measure. Dataset and budgets: tests/performance/dataset.md and
      # tests/performance/thresholds.json.
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages performance-smoke -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/performance-smoke.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-performance-smoke
          path: build/quality-evidence/**

  migration-verification:
    name: 'gate 14 migration verification'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Docker engine must be present
        run: |
          set -euo pipefail
          docker version
      - name: Start PostgreSQL/pgvector and give the development database the pre-boot shape
        # `firstelement` here is a throwaway CI container. The gate proves
        # that the migration and rehearsal stages do not modify it.
        run: |
          set -euo pipefail
          docker run -d --name firstelement-postgres \
            -e POSTGRES_USER=firstelement -e POSTGRES_PASSWORD=firstelement \
            -e POSTGRES_DB=firstelement -p 5432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec firstelement-postgres pg_isready -U firstelement >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker cp ops/flyway/sql/V20260814000000__baseline_verified_live_schema.sql firstelement-postgres:/tmp/base.sql
          docker exec firstelement-postgres psql -U firstelement -d firstelement -v ON_ERROR_STOP=1 -q -f /tmp/base.sql
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages migration-verification -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/migration-verification.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-migration-verification
          path: build/quality-evidence/**

  restore-rehearsal:
    name: 'gate 15 backup + restore rehearsal'
    needs: backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Docker engine must be present
        run: |
          set -euo pipefail
          docker version
      - name: Start PostgreSQL/pgvector and seed rows so the rehearsal has data to compare
        run: |
          set -euo pipefail
          docker run -d --name firstelement-postgres \
            -e POSTGRES_USER=firstelement -e POSTGRES_PASSWORD=firstelement \
            -e POSTGRES_DB=firstelement -p 5432:5432 pgvector/pgvector:pg16
          for i in $(seq 1 30); do
            if docker exec firstelement-postgres pg_isready -U firstelement >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker cp ops/flyway/sql/V20260814000000__baseline_verified_live_schema.sql firstelement-postgres:/tmp/base.sql
          docker exec firstelement-postgres psql -U firstelement -d firstelement -v ON_ERROR_STOP=1 -q -f /tmp/base.sql
          docker exec firstelement-postgres psql -U firstelement -d firstelement -v ON_ERROR_STOP=1 -q -c \
            "insert into organizations (id, name, \"createdAt\", \"updatedAt\") values (gen_random_uuid(), 'ci-restore-fixture', (now() at time zone 'UTC'), (now() at time zone 'UTC'));"
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages restore-rehearsal -EvidenceRoot "${{ github.workspace }}/build/quality-evidence" -JsonOut "${{ github.workspace }}/build/quality-evidence/restore-rehearsal.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-restore-rehearsal
          path: build/quality-evidence/**

  no-hidden-skips:
    name: 'gate 16 no hidden skips'
    needs: [ backend-unit, backend-integration ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: evidence-backend-unit
          path: build/quality-evidence
      - uses: actions/download-artifact@v4
        with:
          name: evidence-backend-integration
          path: build/quality-evidence
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Run the gate
        shell: pwsh
        run: ./ops/quality/run-gates.ps1 -Stages no-hidden-skips -EvidenceRoot "${{ github.workspace }}/build/quality-evidence/skipcheck" -JsonOut "${{ github.workspace }}/build/quality-evidence/no-hidden-skips.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-no-hidden-skips
          path: build/quality-evidence/**

  quality-gate-verdict:
    name: 'quality gate verdict'
    needs:
      - format-static
      - legacy-node-static
      - backend-compile
      - backend-unit
      - architecture
      - backend-integration
      - openapi-contract
      - security-tenant-negative
      - worker-idempotency-recovery
      - export-finance
      - angular-component
      - playwright-journeys
      - performance-smoke
      - migration-verification
      - restore-rehearsal
      - no-hidden-skips
    # always(): the summary is produced even when a stage failed. A
    # pipeline that says nothing on failure is a pipeline people route
    # around.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PowerShell 7
        shell: pwsh
        run: $PSVersionTable | Out-String | Write-Host
      - name: Write the aggregate required status
        shell: pwsh
        run: |
          $results = [ordered]@{
            'format-static'                = '${{ needs.format-static.result }}'
            'legacy-node-static'           = '${{ needs.legacy-node-static.result }}'
            'backend-compile'              = '${{ needs.backend-compile.result }}'
            'backend-unit'                 = '${{ needs.backend-unit.result }}'
            'architecture'                 = '${{ needs.architecture.result }}'
            'backend-integration'          = '${{ needs.backend-integration.result }}'
            'openapi-contract'             = '${{ needs.openapi-contract.result }}'
            'security-tenant-negative'     = '${{ needs.security-tenant-negative.result }}'
            'worker-idempotency-recovery'  = '${{ needs.worker-idempotency-recovery.result }}'
            'export-finance'               = '${{ needs.export-finance.result }}'
            'angular-component'            = '${{ needs.angular-component.result }}'
            'playwright-journeys'          = '${{ needs.playwright-journeys.result }}'
            'performance-smoke'            = '${{ needs.performance-smoke.result }}'
            'migration-verification'       = '${{ needs.migration-verification.result }}'
            'restore-rehearsal'            = '${{ needs.restore-rehearsal.result }}'
            'no-hidden-skips'              = '${{ needs.no-hidden-skips.result }}'
          }
          $rows = @()
          foreach ($k in $results.Keys) {
            $r = $results[$k]
            $mark = if ($r -eq 'success') { 'PASS' } elseif ($r -eq 'skipped') { 'SKIPPED (a failure upstream)' } else { 'FAIL' }
            $rows += ('| `{0}` | {1} | {2} |' -f $k, $r, $mark)
          }
          $failed = @($results.Keys | Where-Object { $results[$_] -ne 'success' })
          $summary = @('# FirstElement quality-gate verdict', '', ('| stage | result | verdict |'), '|---|---|---|') + $rows
          if ($failed.Count -gt 0) {
            $summary += ''
            $summary += ('Not green: ' + ($failed -join ', '))
            $summary += ''
            $summary += 'A `skipped` result here means an upstream stage failed, not that a suite was allowed to skip. The `no-hidden-skips` gate is what proves the second case cannot happen.'
            $summary | Out-File -FilePath 'GATE-VERDICT.md' -Encoding utf8
            $summary | Write-Host
            exit 1
          }
          $summary += ''
          $summary += 'Every stage reported its own status. The evidence bundles are attached to the individual gate jobs.'
          $summary | Out-File -FilePath 'GATE-VERDICT.md' -Encoding utf8
          $summary | Write-Host
          exit 0
      - name: Publish the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-verdict
          path: GATE-VERDICT.md