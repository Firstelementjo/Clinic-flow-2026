# Local-only override.
#
# 1. The web service mounts nginx.conf read-only, which makes the stock nginx
#    entrypoint's 10-listen-on-ipv6-by-default.sh fail and crash-loop the
#    container. Bypass /docker-entrypoint.d and run nginx directly.
# 2. Docker Desktop presents the repo's yarn workspace junctions
#    (node_modules/@firstelement/*) as Linux symlinks pointing at
#    /mnt/host/c/..., which do not exist inside the container — so node cannot
#    resolve the @firstelement package. Overlay an anonymous volume on that
#    directory and re-point the links at /workspace/* before boot.
services:
  web:
    entrypoint: ["sh", "-c", "nginx -g 'daemon off;'"]

  api:
    volumes:
      - node-firstelement:/workspace/node_modules/@firstelement
    command: >
      sh -c "
        set -e
        for p in ai auth config connectors database events knowledge-base messaging routing shared ui; do
          rm -rf /workspace/node_modules/@firstelement/$$p
          ln -sfn /workspace/packages/$$p /workspace/node_modules/@firstelement/$$p
        done
        for a in api web worker; do
          rm -rf /workspace/node_modules/@firstelement/$$a
          ln -sfn /workspace/apps/$$a /workspace/node_modules/@firstelement/$$a
        done
        yarn db:generate && yarn db:push && yarn workspace @firstelement/api start
      "

  worker:
    volumes:
      - node-firstelement:/workspace/node_modules/@firstelement
    command: >
      sh -c "
        set -e
        for p in ai auth config connectors database events knowledge-base messaging routing shared ui; do
          rm -rf /workspace/node_modules/@firstelement/$$p
          ln -sfn /workspace/packages/$$p /workspace/node_modules/@firstelement/$$p
        done
        for a in api web worker; do
          rm -rf /workspace/node_modules/@firstelement/$$a
          ln -sfn /workspace/apps/$$a /workspace/node_modules/@firstelement/$$a
        done
        while [ ! -d /workspace/apps/worker/dist ]; do sleep 3; done
        yarn workspace @firstelement/worker start
      "

volumes:
  node-firstelement: