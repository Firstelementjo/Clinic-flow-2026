spring:
  application:
    name: firstelement-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/firstelement}
    username: ${DATABASE_USER:firstelement}
    password: ${DATABASE_PASSWORD:firstelement}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: ${API_PORT:4000}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  server:
    # Operator surface is bound separately from the tenant-facing API port so
    # probes/metrics/OpenAPI are never part of the public ingress surface.
    port: ${MANAGEMENT_PORT:4101}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}

springdoc:
  api-docs:
    path: /api/v1/openapi
    use-management-port: true
  swagger-ui:
    path: /api/v1/docs
    use-management-port: true

firstelement:
  environment: ${APP_ENV:LOCAL}
  api:
    port: ${API_PORT:4000}
    web-origin: ${WEB_ORIGIN:http://localhost:5173}
    session-secret: ${SESSION_SECRET:change-me-to-a-long-random-string-min-32-chars}
  worker:
    concurrency: ${WORKER_CONCURRENCY:4}
    shutdown-drain-seconds: ${WORKER_SHUTDOWN_DRAIN_SECONDS:20}
  security:
    # Read only when the platform console is enabled. Empty is the intended default: the codec
    # refuses to construct rather than storing an operator's TOTP secret under a key published in
    # the repository, so a console enabled without a key fails at startup instead of at first use.
    encryption-key: ${ENCRYPTION_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  platform:
    console:
      # Off means /api/v1/platform/** has no handler at all -- absent, not open. See
      # docs/migration/adr/0023-platform-console-is-opt-in-and-separately-chained.md
      enabled: ${PLATFORM_CONSOLE_ENABLED:true}

logging:
  level:
    root: info
